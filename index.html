<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クレーンゲーム</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- ホーム画面に追加して開くと、アドレスバーなしの全画面で表示される -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クレーンゲーム">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&text=%E3%82%AF%E3%83%AC%E3%83%BC%E3%83%B3%E3%82%B2%E3%83%A0&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a4458; --ink-soft:#7d7690; --paper:#fffdf8; --line:#eadff2;
  --pink:#ff86a8; --pink-deep:#f0608a; --sky:#8ecbff; --mint:#8fdfc0; --cream:#fff3bf; --lav:#cdbcf8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#fff6fa 0%,#f4f9ff 55%,#f0fcf6 100%);
}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
rt{font-size:.5em;font-weight:400}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation}

/* ---- HUD ---- */
#hud{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;max-width:62vw;pointer-events:none}
.pill{background:rgba(255,253,248,.92);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:18px;line-height:1.5;white-space:nowrap}
.pill b{font-size:24px;color:var(--pink-deep);margin:0 2px}
#pMode{background:var(--cream);border-color:#f3dc86}
#pTime.hurry{border-color:var(--pink);color:var(--pink-deep)}
#side{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.sbtn{min-width:52px;min-height:52px;padding:6px 14px;border-radius:16px;background:var(--paper);border:3px solid var(--line);font-weight:700;font-size:17px;line-height:1.5;box-shadow:0 3px 0 #dccfe8}
.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #dccfe8}
#bHelp{font-size:26px;border-radius:50%;width:54px;padding:0}
#bView{background:#e6f3ff;border-color:#b9dcfb;box-shadow:0 3px 0 #a5cdef}
#ver{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:11px;color:var(--ink-soft);opacity:.75;pointer-events:none}

/* ---- 操作 ---- */
.ctl{position:absolute;bottom:22px;display:none}
#ctlMove{left:22px}
#ctlCatch{right:22px}
#stick{width:150px;height:150px;border-radius:50%;background:rgba(255,253,248,.85);border:4px solid var(--lav);position:relative;touch-action:none}
#stick::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed #ddd2f6}
#knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--lav);border:4px solid #fff;box-shadow:0 4px 0 #a996e0}
#dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:4px}
.dbtn{border-radius:16px;background:var(--paper);border:3px solid var(--lav);font-size:28px;font-weight:700;box-shadow:0 4px 0 #b6a5e6;touch-action:none}
.dbtn.down{transform:translateY(3px);box-shadow:0 1px 0 #b6a5e6;background:#efe8ff}
#dU{grid-column:2;grid-row:1}#dL{grid-column:1;grid-row:2}#dR{grid-column:3;grid-row:2}#dD{grid-column:2;grid-row:3}
#two{display:flex;gap:14px}
.tbtn{width:108px;height:108px;border-radius:24px;background:var(--paper);border:4px solid var(--line);font-weight:700;font-size:17px;line-height:1.3;box-shadow:0 5px 0 #d5c9e2;opacity:.45;touch-action:none}
.tbtn .ar{display:block;font-size:40px;line-height:1}
.tbtn.on{opacity:1;border-color:var(--pink);box-shadow:0 5px 0 var(--pink-deep);animation:pulse 1s infinite}
.tbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep);background:#ffe9f0;animation:none}
@keyframes pulse{50%{background:#fff0f5}}
#bCatch{width:118px;height:118px;border-radius:50%;background:var(--pink);color:#fff;font-size:21px;font-weight:700;border:5px solid #fff;box-shadow:0 6px 0 var(--pink-deep);touch-action:none}
#bCatch:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
#bCatch:disabled{opacity:.4}

#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font-size:64px;font-weight:700;color:#fff;-webkit-text-stroke:8px var(--pink-deep);paint-order:stroke fill;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.sub{-webkit-text-stroke-color:#6aa9e6;font-size:48px}

/* ---- 画面 ---- */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(245,236,250,.82);padding:14px;z-index:10}
.ov.show{display:flex}
.card{background:var(--paper);border:4px solid var(--line);border-radius:28px;padding:22px 26px;width:min(760px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 0 rgba(180,160,210,.35);text-align:center}
.card h1{margin:0 0 4px;font-size:38px;letter-spacing:.06em;color:var(--pink-deep)}
.card h2{margin:0 0 12px;font-size:28px}
.lead{margin:0 0 16px;font-size:18px;color:var(--ink-soft)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mbtn{border-radius:22px;padding:16px 8px;min-height:150px;border:4px solid;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.mbtn strong{font-size:26px}
.mbtn span{font-size:14px;line-height:1.8;color:var(--ink-soft);white-space:nowrap}
.mbtn:active{transform:translateY(3px)}
.setrows{display:grid;gap:10px;margin-bottom:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 10px 6px 16px;font-size:19px;line-height:1.9;text-align:left}
.setlab b{display:inline-block;border-radius:999px;padding:0 10px;font-size:15px;margin-right:4px}
.tagE{background:#effbf6;border:2px solid var(--mint)}.tagN{background:#eff7ff;border:2px solid var(--sky)}.tagH{background:#fff1f5;border:2px solid var(--pink)}
.stepper{display:flex;align-items:center;gap:6px}
.sb{width:52px;height:52px;border-radius:14px;background:var(--paper);border:3px solid var(--lav);font-size:20px;box-shadow:0 3px 0 #b6a5e6}
.sb:active{transform:translateY(2px);box-shadow:0 1px 0 #b6a5e6}
.sv{min-width:92px;text-align:center;font-size:22px;font-weight:700;color:var(--pink-deep)}
.mbtn.e{border-color:var(--mint);background:#effbf6;box-shadow:0 6px 0 var(--mint)}
.mbtn.n{border-color:var(--sky);background:#eff7ff;box-shadow:0 6px 0 var(--sky)}
.mbtn.h{border-color:var(--pink);background:#fff1f5;box-shadow:0 6px 0 var(--pink)}
.steps{display:grid;gap:10px;text-align:left;margin-bottom:16px}
.step{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 14px;font-size:18px;line-height:1.9}
.step svg{flex:0 0 76px;width:76px;height:76px}
.step b{color:var(--pink-deep)}
.big{min-width:200px;min-height:60px;border-radius:999px;background:var(--pink);color:#fff;font-size:24px;font-weight:700;padding:8px 30px;box-shadow:0 6px 0 var(--pink-deep);margin:4px 6px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.big.alt{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 #dccfe8}
#resNum{font-size:64px;font-weight:700;color:var(--pink-deep);line-height:1.1}
#resMsg{font-size:22px;margin:6px 0 12px}
#resList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-size:17px;font-weight:700;background:#fff}
.chip i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.08)}
@media (max-width:640px){
  .modes{grid-template-columns:1fr}.mbtn{min-height:84px}
  .card h1{font-size:30px}.step{font-size:16px}.step svg{flex-basis:56px;width:56px;height:56px}
  .pill{font-size:14px;padding:4px 10px}.pill b{font-size:18px}
  #stick{width:128px;height:128px}#bCatch{width:100px;height:100px;font-size:18px}
  .tbtn{width:92px;height:92px}#dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
  #toast{font-size:44px}
}
/* ==== スマホ横向き（高さ500px以下）だけに効く調整。iPadには影響しない ==== */
@media (orientation:landscape) and (max-height:500px){
  .ov{padding:8px}
  .card{padding:10px 16px 0;border-width:3px}
  .card h1{font-size:26px}.card h2{font-size:20px;margin-bottom:6px}.lead{font-size:15px;margin-bottom:8px}
  .mbtn{min-height:96px;padding:8px}
  .steps{grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
  .step{font-size:14px;line-height:1.6;padding:4px 10px;gap:8px}
  .step svg{flex-basis:44px;width:44px;height:44px}
  #bStart{position:sticky;bottom:6px;min-height:52px;font-size:20px}
  #resNum{font-size:44px}
}

/* ==== スマホ用パネル調整：スマホ（画面が低いとき）だけに効く。iPadには影響しない ==== */
@media (orientation:landscape) and (max-height:500px), (orientation:portrait) and (max-height:700px){
  #bStart{position:sticky;bottom:6px;z-index:5;box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(-8px -100vmax)}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<!-- build: 2026-11-14n -->
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill" id="pMode"></div>
  <div class="pill" id="pWon"><ruby>取<rt>と</rt></ruby>れた <b id="nWon">0</b>こ</div>
  <div class="pill" id="pPlays"></div>
  <div class="pill" id="pTime"></div>
</div>
<div id="side">
  <button class="sbtn" id="bHelp" aria-label="あそびかた">？</button>
  <button class="sbtn" id="bView"></button>
  <button class="sbtn" id="bSound"></button>
  <button class="sbtn" id="bMenu">メニュー</button>
</div>

<div class="ctl" id="ctlMove">
  <div id="stick"><div id="knob"></div></div>
  <div id="dpad">
    <button class="dbtn" id="dU" data-k="U">↑</button><button class="dbtn" id="dL" data-k="L">←</button>
    <button class="dbtn" id="dR" data-k="R">→</button><button class="dbtn" id="dD" data-k="D">↓</button>
  </div>
  <div id="two">
    <button class="tbtn" id="tX">① よこ<span class="ar">→</span></button>
    <button class="tbtn" id="tZ">② おく<span class="ar">↑</span></button>
  </div>
</div>
<div class="ctl" id="ctlCatch"><button id="bCatch">キャッチ</button></div>
<div id="toast"></div>
<div id="ver"></div>

<div class="ov show" id="ovMenu"><div class="card scroll">
  <h1>クレーンゲーム</h1>
  <p class="lead">むずかしさを えらんでね</p>
  <div class="modes">
    <button class="mbtn e" data-mode="easy"><strong>やさしい</strong><span id="mdE"></span></button>
    <button class="mbtn n" data-mode="normal"><strong>ふつう</strong><span id="mdN"></span></button>
    <button class="mbtn h" data-mode="hard"><strong>ホンモノモード</strong><span id="mdH"></span></button>
  </div>
  <button class="big alt" id="bSet" style="margin-top:16px">⚙ せってい</button>
</div></div>

<div class="ov" id="ovSet"><div class="card scroll">
  <h2>せってい</h2>
  <div class="setrows">
    <div class="setrow"><div class="setlab"><b class="tagE">やさしい</b> ゲームの <ruby>時間<rt>じかん</rt></ruby></div><div class="stepper" data-opt="easyTime"><button class="sb">◀</button><span class="sv"></span><button class="sb">▶</button></div></div>
    <div class="setrow"><div class="setlab"><b class="tagN">ふつう</b> <ruby>回数<rt>かいすう</rt></ruby></div><div class="stepper" data-opt="normalPlays"><button class="sb">◀</button><span class="sv"></span><button class="sb">▶</button></div></div>
    <div class="setrow"><div class="setlab"><b class="tagN">ふつう</b> 1<ruby>回<rt>かい</rt></ruby>の <ruby>時間<rt>じかん</rt></ruby></div><div class="stepper" data-opt="normalTime"><button class="sb">◀</button><span class="sv"></span><button class="sb">▶</button></div></div>
    <div class="setrow"><div class="setlab"><b class="tagH">ホンモノ</b> コインの <ruby>数<rt>かず</rt></ruby></div><div class="stepper" data-opt="hardCoins"><button class="sb">◀</button><span class="sv"></span><button class="sb">▶</button></div></div>
  </div>
  <button class="big" id="bSetOk">OK</button>
</div></div>

<div class="ov" id="ovHelp"><div class="card scroll">
  <h2 id="helpTitle"></h2>
  <div class="steps" id="helpSteps"></div>
  <button class="big" id="bStart">はじめる</button>
</div></div>

<div class="ov" id="ovRes"><div class="card scroll">
  <h2 id="resTitle"></h2>
  <div id="resNum"></div>
  <div id="resMsg"></div>
  <div id="resList"></div>
  <button class="big" id="bAgain">もういちど</button>
  <button class="big alt" id="bBack">むずかしさを えらぶ</button>
</div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   調整値（ここの数字だけ直せば、速さ・むずかしさを変えられます）
   ===================================================================== */
const CFG = {
  version: 'v2026-11-14n',
  field: { W: 6.0, D: 4.6 },          // 台の中の広さ（横・奥）
  hole:  { w: 1.7, d: 1.7 },          // 落とし口（手前の左すみ）
  gravity: 14,
  claw: {
    topY: 3.3, minY: 0.9, railY: 4.05,
    speed: 1.7,        // 横・奥に動く速さ
    returnSpeed: 2.0,  // 穴へもどる速さ
    down: 1.5, up: 1.3,
    openA: 0.58, closeA: -0.15, closeTime: 0.6,   // openA＝開いたときの角度（0.64で先が垂直、小さいほど先が内向き）
    hubR: 0.22, tipR: 0.11, margin: 0.75,
  },
  hold: { k: 220, c: 14, releaseDist: 0.42, minQ: 0.12, slipT: 0.15 },   // つかんだ景品を支えるばね。slipT＝力が足りない状態がこの秒数つづくとすべり落ちる
  sway: { omega: 2.6, zeta: 0.16 },
  /* すべり落ち：つかんだ瞬間に「落ちるかどうか」と「いつ落ちるか」を決める（本物でよく落ちる場面だけで落とす）
     line＝これより力が弱いと落ちる／top・start・travel＝落ちる場面の割合（上がりきってガクンとゆれたとき・横に動き出したとき・移動中）
     safe＝穴の中心からこれ以上はなれた所でだけ落とす／topPause＝上がりきってから横に動き出すまでの秒数 */
  // メニューの「せってい」でえらべる値（0は「なし」）
  options: {
    easyTime:    { mode: 'easy',   key: 'gameTime',  list: [30, 60, 90, 120, 180, 0] },
    normalPlays: { mode: 'normal', key: 'plays',     list: [3, 5, 10, 15, 20] },
    normalTime:  { mode: 'normal', key: 'timeLimit', list: [0, 15, 30, 60] },
    hardCoins:   { mode: 'hard',   key: 'plays',     list: [3, 6, 10, 15] },
  },
  slip: { line: 1.0, top: 0.15, start: 0.5, travel: 0.35, safe: 1.3, topPause: 0.45, jolt: 0.18,
          topSlipT: 0.1, startSpeed: 0.7, edgeSafe: 0.3, carry: 0.45,   // carry＝すべり落ちるとき、運んでいた勢いがどれだけ残るか（大きいほど ラッキーで穴に入りやすい）
          topPop: 1.6, swingT: 0.7, bump: 0.05 },   // topPop＝上がりきった衝撃で はねる強さ／swingT＝ゆれてから落ちるまでの秒数／bump＝衝撃でアームがはねる大きさ                          // アームのゆれ（ふりこ）
  originalColorRate: 0.25,
  prizeAngDamp: 0.15,      // 景品の回転のしにくさ（小さいほど、ツメが当たったときに倒れやすい）
  pressTime: 0.3,          // ツメが景品の上に乗ってから、おしこみ続ける秒数（この間に景品が倒れたりずれたりする）                                   // キャラが元の色で出る割合
  resultDelay: 0.9,
  out: { wait: 0.9, roll: 1.1, slide: 0.8 },   // 取れた景品：穴に落ちてから出てくるまで／ころがる時間／ならぶ時間（秒）
  modes: {
    easy: {
      name: 'やさしい', control: 'stick', fingers: 3, plays: Infinity, timeLimit: 0, gameTime: 60,   // gameTime＝ゲーム全体の時間（秒）
      speed: 1.7,                      // クレーンが横・奥に動く速さ
      accel: 30, decel: 40,            // 動き出し・止まりの鋭さ（大きいほどピタッと止まる）
      swayGain: 0.03, topKick: 0.04,   // ゆれの大きさ
      grabR: 0.6,                      // つかめる範囲（中心からのずれの許容）
      sLift: 2.0, sTop: 1.15,          // アームの強さ（持ち上げ中／上がりきった後）。1.0で景品の重さとつり合う
      strRand: [0.7, 1.2],            // 1回ごとのアームの強さのばらつき（本物のように毎回ちがう）
      weakenT: 0.4,                    // 上がりきってから力がぬけきるまでの秒数
      guide: 'shadow', fence: 0, nudge: 1.6, orient: false, comStrict: false, easeTop: true, fingerHit: false,
      layout: 'spread',
      cam: { drag: false },                                  // 前・横の切りかえだけ
      prizes: ['cube', 'chick', 'panda', 'rabbit', 'cat', 'car', 'pudding', 'egg', 'bear', 'penguin', 'donut'],
    },
    normal: {
      name: 'ふつう', control: 'dpad', fingers: 3, plays: 5, timeLimit: 30, gameTime: 0,          // timeLimit＝1回ごとの時間（秒）
      speed: 1.6, accel: 20, decel: 22, swayGain: 0.08, topKick: 0.08,
      grabR: 0.5, sLift: 2.0, sTop: 1.2, strRand: [0.65, 1.15], weakenT: 0.4,
      guide: 'none', fence: 0.10, nudge: 1.2, orient: false, comStrict: false, easeTop: true, fingerHit: true,
      layout: 'mixed',
      cam: { drag: true, yaw: [-95, 95], lift: false },      // 画面をなぞって横に回りこめる（角度は度）
      prizes: ['chick', 'panda', 'cat', 'dog', 'ball', 'rabbit', 'egg', 'cube', 'car', 'pudding', 'bear', 'penguin', 'donut'],
    },
    hard: {
      name: 'ホンモノ', control: 'two', fingers: 2, plays: 6, timeLimit: 0, gameTime: 0,
      speed: 1.1, accel: 10, decel: 3.5, swayGain: 0.2, topKick: 0.16,
      grabR: 0.48, sLift: 2.0, sTop: 1.35, strRand: [0.82, 1.1], weakenT: 0.5,
      pity: 0.08,                      // 取れないたびに少しずつアームが強くなる（本物の「確率機」のしくみ）。取れたら元にもどる
      guide: 'none', fence: 0.22, nudge: 0.9, orient: true, comStrict: true, easeTop: false, fingerHit: true,
      layout: 'pile',
      cam: { drag: true, yaw: [-90, 90], lift: true, h: [-2.0, 1.3] },   // 回りこみ＋背のび・しゃがむ
      prizes: ['chick', 'rabbit', 'cat', 'dog', 'ball', 'car', 'egg', 'gourd', 'pudding', 'worm', 'cube', 'bear', 'penguin', 'donut'],

let dragId = null, dragX = 0, dragY = 0;
canvas.addEventListener('pointerdown', e => {
  const L = camLimits(); if (!L || G.paused || dragId !== null) return;
  dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY; try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return; const L = camLimits(); if (!L) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY; dragX = e.clientX; dragY = e.clientY;
  CAM.tyaw = Math.min(L.y1, Math.max(L.y0, CAM.tyaw - dx * 0.006));   // 右になぞると右が見える
  CAM.th = Math.min(L.h1, Math.max(L.h0, CAM.th + dy * 0.012));       // 上になぞると しゃがんで上を見る
  const atF = camAtFront(); if (atF !== CAM.wasFront) { CAM.wasFront = atF; updateHud(); }
});
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(ev, e => { if (e.pointerId === dragId) { dragId = null; updateHud(); } });
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  G.camScale = Math.max(1, Math.tan(THREE.MathUtils.degToRad(19.5)) / Math.tan(hf / 2));
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit); fit();

const UP = new THREE.Vector3(0, 1, 0);
function animate(dt) {
  const C = CFG.claw, M = G.M;
  // カメラ
  const k = 1 - Math.exp(-6 * dt);
  CAM.yaw += (CAM.tyaw - CAM.yaw) * k; CAM.h += (CAM.th - CAM.h) * k;
  G.view = CAM.yaw > 45 * D2R ? 'side' : CAM.yaw < -45 * D2R ? 'left' : 'front';
  tT.set(0, CAM.tgtY + CAM.h * 0.25, 0.25);
  vT.set(Math.sin(CAM.yaw) * CAM.R, CAM.H + CAM.h, Math.cos(CAM.yaw) * CAM.R).multiplyScalar(G.camScale).add(tT);
  camPos.copy(vT); camTgt.copy(tT);
  camera.position.copy(camPos); camera.lookAt(camTgt);
  // クレーン
  if (G.phase === 'ready') claw.angleT = C.openA;
  claw.fingers.forEach((f, i) => { f.rotation.z = claw.fa[i]; });
  const px = clawPX(), pz = clawPZ();
  clawVis.position.set(px, claw.y, pz);
  if (claw.bump) { claw.bump.t += dt; const t = claw.bump.t; clawVis.position.y += claw.bump.a * Math.exp(-t * 9) * Math.sin(t * 42); if (t > 0.6) claw.bump = null; }   // 上がりきった衝撃で はねる clawVis.rotation.set(claw.sz * 0.6, 0, -claw.sx * 0.6);
  bridge.position.set(0, C.railY + 0.1, claw.cz); carriage.position.set(claw.cx, C.railY, claw.cz);
  const top = new THREE.Vector3(claw.cx, C.railY - 0.14, claw.cz), bot = new THREE.Vector3(px, claw.y + 0.25, pz);
  rope.position.copy(top).add(bot).multiplyScalar(0.5); rope.scale.y = top.distanceTo(bot);
  rope.quaternion.setFromUnitVectors(UP, bot.clone().sub(top).normalize());
  // 目印
  const guide = M ? M.guide : 'none', aiming = M && (G.phase === 'ready' || G.phase === 'descend');
  ring.visible = aimLine.visible = guide === 'ring' && aiming; blob.visible = false;
  if (ring.visible) {
    const s = 1 + Math.sin(G.t * 2.4) * 0.06; ring.scale.set(s, s, 1);
    ring.material.opacity = 0.3 + Math.sin(G.t * 2.4) * 0.06;
    aimLine.material.opacity = 0.1 + Math.sin(G.t * 2.4) * 0.03;
    ring.position.set(px, 0.03, pz);
    const h = Math.max(0.05, claw.y - 0.8); aimLine.scale.y = h; aimLine.position.set(px, h / 2, pz);
  }
  if (blob.visible) { blob.position.set(px, 0.03, pz); if (inHoleXZ(blob.position, 0.3)) blob.visible = false; }
  // 景品（物理ボディ → 見た目）
  for (const p of G.prizes) {
    if (p.won) continue;
    p.holder.position.copy(p.body.position); p.holder.quaternion.copy(p.body.quaternion);
  }
  // 画面表示
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').className = ''; }
  if (M && (M.timeLimit || M.gameTime)) {
    const s = Math.ceil(M.gameTime ? G.gameLeft : G.timeLeft); const e = $('pTime');
    if (e.dataset.s !== String(s)) { e.dataset.s = String(s); e.innerHTML = `のこり <b>${s}</b>${rb('秒', 'びょう')}`; e.classList.toggle('hurry', s <= 5); }
  }
  if (M && M.control === 'two') {
    const rdy = G.phase === 'ready';
    $('tX').classList.toggle('on', rdy && (G.hs === 0 || G.hs === 1));
    $('tZ').classList.toggle('on', rdy && (G.hs === 0 || G.hs === 2 || G.hs === 3));
  }
  $('bCatch').disabled = G.phase !== 'ready';
  musicUpdate(dt);
}

/* ===================== テスト用フック =====================
   ・景品は cannon-es のボディ（p.body.position）が正。見た目（p.holder.position）は描画時にボディから写している。
   ・クレーンは claw.cx / claw.cz（台車）＋ claw.sx / claw.sz（ゆれ）と claw.y（高さ）で動かしている。clawVis.position は描画時に写すだけ。
   ・api.tick(n, dt) は描画なしで固定ステップだけ進める。 */
const hook = window.__game = {
  G, CFG, claw, camera, scene, world, DEFS, frames: 0, elapsed: 0, seed: null, rnd,
  get prizes() { return G.prizes; }, get state() { return G; },
  api: {
    start(mode) { startGame(mode); showOv(null); },
    tick(n = 1, dt = STEP) { for (let i = 0; i < n; i++) step(dt); },
    setInput(ix, iy) { input.ix = ix; input.iy = iy; },
    press(k) { if (k === 'x' || k === 'z') hardDown(k); else input[k] = 1; },
    release(k) { if (k === 'x' || k === 'z') hardUp(k); else input[k] = 0; },
    catchNow, startDescend,
    aimAt(x, z) { claw.cx = x; claw.cz = z; claw.vx = claw.vz = 0; },
    setView(v) { setCamTarget(v === 'side' ? Math.PI / 2 : 0, 0); },
    setCam(yawDeg, h) { setCamTarget(yawDeg * D2R, h || 0); },
    gripQ: (i) => gripQ(G.prizes[i], true),
    getState() {
      return {
        mode: G.mode, phase: G.phase, gameLeft: G.gameLeft, hs: G.hs, plays: G.plays, won: G.won.length, timeLeft: G.timeLeft, paused: G.paused, view: G.view,
        claw: { x: clawPX(), y: claw.y, z: clawPZ(), cx: claw.cx, cz: claw.cz, sx: claw.sx, sz: claw.sz, holding: claw.hold ? G.prizes.indexOf(claw.hold.p) : -1, q: claw.hold ? claw.hold.q : 0 },
        prizes: G.prizes.map(p => { const c = new CANNON.Vec3(); p.body.pointToWorldFrame(p.centerL, c); return { key: p.key, won: p.won, x: p.body.position.x, y: p.body.position.y, z: p.body.position.z, cx: c.x, cy: c.y, cz: c.z }; }),
      };
    },
  },
};

/* ===================== メインループ ===================== */
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  if (dt > 1 / 30) dt = 1 / 30;            // 止まっていた後に一気に進まないようにする（120Hzでも速さは同じ）
  if (dt < 0) dt = 0;
  if (!G.paused && G.M) { acc += dt; let n = 0; while (acc >= STEP && n < 3) { step(STEP); acc -= STEP; n++; } if (n === 3) acc = 0; }
  animate(dt);
  renderer.render(scene, camera);
  hook.frames++; hook.elapsed += dt;
}
$('ver').textContent = CFG.version; refreshMenu();
buildClaw(3); updateHud();
requestAnimationFrame(loop);
</script>
</body>
